[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "iwild"
version = "0.0.1"
description = "An attempt at scaling beyond the benchmark heights on the iWILD Cam Challenge"
authors = [
  { name = "IDL F26 Group 30" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["iwild"]
force_sort_within_sections = true
